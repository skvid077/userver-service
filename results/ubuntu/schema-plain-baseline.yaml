                description: "When set to `false`, disables deadline propagation within this\nhandler. This includes:\n\n- reading the task-inherited deadline from HTTP headers and gRPC\n  metadata;\n- interrupting operations when deadline expires;\n- propagating the deadline to downstream services and databases.\n\nDeadline propagation can also be disabled in the static config of:\n- components::Server (to set the default for all HTTP handlers).\n\nDeadline propagation is disabled if disabled statically OR\ndynamically.\n"
              response-body-stream:
                type: boolean
                description: TODO
              monitor-handler:
                type: boolean
                description: overrides the in-code `is_monitor` flag that makes the handler run either on 'server.listener' or on 'server.listener-monitor'
              max_requests_per_second:
                type: integer
                description: "integer to limit RPS to this handler\n\nDefault: <no limit>\n"
              path:
                type: string
                description: if a request matches this path wildcard then process it by handler
              throttling_enabled:
                type: boolean
                description: allow throttling of the requests by components::Server , for more info see its `max_response_size_in_flight` and `requests_queue_size_threshold` options
          http-client:
            type: object
            description: Component that manages clients::http::ClientWithMiddlewares.
            additionalProperties: false
            properties:
              middlewares:
                type: object
                description: map of middlewares to apply. Middleware settings from components::HttpClient override settings from @ref clients::http::MiddlewarePipelineComponent
                additionalProperties:
                  type: object
                  description: middleware config
                  additionalProperties: false
                  properties:
                    enabled:
                      type: boolean
                      description: enable middleware
                properties:
                  {}
              core-component:
                type: string
                description: name of components::HttpClientCore component to use
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              wait-for-dynamic-configs:
                type: boolean
                description: "Whether to wait for dynamic configs to be loaded.\nDefaults to true for all clients except for dynamic-config-http-client.\n"
          logging:
            type: object
            description: Logging component
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              loggers:
                type: object
                description: logger options
                additionalProperties:
                  type: object
                  description: logger options
                  additionalProperties: false
                  properties:
                    fs-task-processor:
                      type: string
                      description: task processor for disk I/O operations for this logger
                    truncate-on-start:
                      type: boolean
                      description: if true, the log file is truncated on service start
                    overflow_behavior:
                      type: string
                      description: "message handling policy while the queue is full: `discard` drops messages, `block` waits until message gets into the queue"
                      enum:
                        - block
                        - discard
                    testsuite-capture:
                      type: object
                      description: if exists, setups additional TCP log sink for testing purposes
                      additionalProperties: false
                      properties:
                        port:
                          type: integer
                          description: testsuite port
                        host:
                          type: string
                          description: testsuite hostname, e.g. localhost
                    flush_queue_size:
                      type: integer
                      description: number of queued messages that wakes the log consumer; values above half of `message_queue_size` are capped at half of `message_queue_size`
                    message_queue_size:
                      type: integer
                      description: the size of internal message queue, must be a power of 2
                    format:
                      type: string
                      description: log output format
                      enum:
                        - json_yadeploy
                        - json
                        - raw
                        - ltsv
                        - tskv
                    flush_level:
                      type: string
                      description: messages of this and higher levels get flushed to the file immediately
                    level:
                      type: string
                      description: log verbosity
                    file_path:
                      type: string
                      description: path to the log file
                properties:
                  {}
              fs-task-processor:
                type: string
                description: task processor for disk I/O operations
              span-log-level:
                type: string
                description: Minimum log level for spans; defaults to the default logger's level
          http-client-middleware-pipeline:
            type: object
            description: Component that provides common http client middlewares
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              middlewares:
                type: object
                description: map of common HTTP client middlewares
                additionalProperties:
                  type: object
                  description: middleware config
                  additionalProperties: false
                  properties:
                    enabled:
                      type: boolean
                      description: enable middleware
                properties:
                  {}
          minimal-server-middleware-pipeline-builder:
            type: object
            description: Base class for a component to configure server middlewares
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              append:
                type: array
                description: list of middlewares to append by default
                items:
                  type: string
                  description: name of a middleware to append
              prepend:
                type: array
                description: list of middlewares to prepend by default
                items:
                  type: string
                  description: name of a middleware to prepend
          os-signal-processor:
            type: object
            description: base component. Don't use it for application components, use ComponentBase instead
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          congestion-control:
            type: object
            description: Component to limit too active requests, also known as CC.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              status-code:
                type: integer
                description: HTTP status code for ratelimited responses
              only-rtc:
                type: boolean
                description: if set to true and hostinfo::IsInRtc() returns false then forces the fake-mode
              min-cpu:
                type: integer
                description: force fake-mode if the current cpu number is less than the specified value
              fake-mode:
                type: boolean
                description: if set, an actual throttling is skipped, but FSM is still working and producing informational logs
          postgres-db-1:
            type: object
            description: PosgreSQL client component
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              persistent-prepared-statements:
                type: boolean
                description: cache prepared statements or not
              max_prepared_cache_size:
                type: integer
                description: prepared statements cache size limit
              dns_resolver:
                type: string
                description: server hostname resolver type (getaddrinfo or async)
                enum:
                  - async
                  - getaddrinfo
              pipeline_enabled:
                type: boolean
                description: turns on pipeline connection mode
              user-types-enabled:
                type: boolean
                description: disabling will disallow use of user-defined types
              blocking_task_processor:
                type: string
                description: "Name of task processor for background blocking operations.\n\nDefault: engine::current_task::GetBlockingTaskProcessor()\n"
              discard-all-on-connect:
                type: boolean
                description: execute discard all on new connections
              min_pool_size:
                type: integer
                description: "number of connections created initially by this component instance to each of the provided PostgreSQL\nhosts. Connections are kept even without requests\n"
              ignore_unused_query_params:
                type: boolean
                description: disable check for not-NULL query params that are not used in query
              max_pool_size:
                type: integer
                description: "maximum number of connections that can be created by this component instance to each of the provided\nPostgreSQL hosts for \"connlimit_mode: manual\". Should not be less than `min_pool_size`\n"
              connecting_interval_ms:
                type: integer
                description: "minimum time in milliseconds between starting new connections to each PostgreSQL host (0 - unlimited)\n"
                minimum: 0
              sync-start:
                type: boolean
                description: perform initial connections synchronously
              check-user-types:
                type: boolean
                description: "cancel service start if some user types have not been loaded, which\nhelps to detect missing migrations\n"
              connlimit_mode:
                type: string
                description: how to learn the `max_pool_size`
                enum:
                  - manual
                  - auto
              application_name:
                type: string
                description: will be displayed in postgres statistics and logs
              dbconnection:
                type: string
                description: connection DSN string (used if no dbalias specified)
              error-injection:
                type: object
                description: error-injection options
                additionalProperties: false
                properties:
                  verdicts:
                    type: array
                    description: possible injection verdicts
                    items:
                      type: string
                      description: what error injection hook may decide to do
                      enum:
                        - random-delay
                        - max-delay
                        - error
                        - timeout
                  probability:
                    type: number
                    description: thrown exception probability
                  enabled:
                    type: boolean
                    description: enable error injection
              max_replication_lag:
                type: string
                description: "replication lag limit for usable replicas. If a replica's lag exceeds this value, it stops receiving\nnew requests\n"
              name_alias:
                type: string
                description: "Name alias to use in dynamic configs.\n\nDefault: name of the component\n"
              max-ttl-sec:
                type: integer
                description: the maximum lifetime for connections
                minimum: 1
              dbalias:
                type: string
                description: name of the database in secdist config (if available)
              pooler-mode:
                type: string
                description: "Pooler mode. `session` (default) for session poolers; `transaction` for\nOdyssey transaction pooler only\n"
                enum:
                  - transaction
                  - session
              connecting_limit:
                type: integer
                description: "limit for concurrent establishing connections number per PostgreSQL host (0 - unlimited)\n"
              statement-log-mode:
                type: string
                description: whether to log SQL statements in a span tag
                enum:
                  - show
                  - hide
              rtt_threshold:
                type: string
                description: "maximum EWMA RTT difference from the fastest alive host. It is used to prefer hosts when no selection\nstrategy is specified or when `kRoundRobin` is requested. Must not exceed one minute. Zero is valid and\nprefers only hosts tied for the lowest RTT. Slower hosts remain available and are used when no eligible\nhost has a known RTT. The same EWMA RTT estimate is used by nearest selection and RTT metrics. RTT\npreference is enabled by default and controlled by the `POSTGRES_RTT_THRESHOLD_ENABLED` dynamic config\n"
              monitoring-dbalias:
                type: string
                description: "Name of the database for monitorings.\n\nDefault: calculated from dbalias or dbconnection options\n"
              max_statement_metrics:
                type: integer
                description: limit of exported metrics for named statements
              deadline-propagation-enabled:
                type: boolean
                description: whether statement timeout is affected by deadline propagation
              max_queue_size:
                type: integer
                description: "maximum number of clients waiting for a connection. storages::postgres::PoolError is thrown if a new\nrequest exceeds this limit\n"
          tests-control:
            type: object
            description: tests-control config
            additionalProperties: false
            properties:
              throttling_enabled:
                type: boolean
                description: allow throttling of the requests by components::Server , for more info see its `max_response_size_in_flight` and `requests_queue_size_threshold` options
              path:
                type: string
                description: if a request matches this path wildcard then process it by handler
              request_body_size_log_limit:
                type: integer
                description: trim the request to this size before logging
              set_tracing_headers:
                type: boolean
                description: whether to set http tracing headers (X-YaTraceId, X-YaSpanId, X-RequestId)
              set-response-server-hostname:
                type: boolean
                description: "set to true to add the `X-YaTaxi-Server-Hostname` header with\ninstance name, set to false to not add the header\n\nDefault: <takes the value from components::Server config>\n"
              max_requests_in_flight:
                type: integer
                description: "integer to limit max pending requests to this handler\n\nDefault: <no limit>\n"
              max_request_size:
                type: integer
                description: "Maximum size of the whole request. Limits both the size of the request\nand the size of a decompressed request body (if compression is being used).\nRequests exceeding the limit are rejected with 'Request Entity Too Large' (413) HTTP code.\n"
              request_headers_size_log_limit:
                type: integer
                description: trim request headers to this size before logging
              testpoint-timeout:
                type: string
                description: timeout to use while working with testpoint-url
              decompress_request:
                type: boolean
                description: allow decompression of the requests
              max_headers_size:
                type: integer
                description: max request headers size of empty to do not limit
              auth:
                type: object
                description: server::handlers::auth::HandlerAuthConfig authorization config
                additionalProperties: true
                properties:
                  types:
                    type: array
                    description: list of auth types
                    items:
                      type: string
                      description: auth type
                  type:
                    type: string
                    description: auth type
              url_trailing_slash:
                type: string
                description: "'both' to treat URLs with and without a trailing slash as equal, 'strict-match' otherwise"
                enum:
                  - strict-match
                  - both
              skip-unregistered-testpoints:
                type: boolean
                description: do not send testpoints data for paths that were not registered by `testpoint-url`
              testpoint-url:
                type: string
                description: an URL that should be notified in the TESTPOINT_CALLBACK and TESTPOINT_CALLBACK_NONCORO macros
              method:
                type: string
                description: comma-separated list of allowed methods
              as_fallback:
                type: string
                description: set to "implicit-http-options" and do not specify a path if this handler processes the OPTIONS requests for paths that do not process OPTIONS method
                enum:
                  - unknown
                  - implicit-http-options
              task_processor:
                type: string
                description: a task processor to execute the requests
              status-codes-log-level:
                type: object
                description: HTTP status code -> log level map
                additionalProperties:
                  type: string
                  description: log level
                properties:
                  {}
              log-level:
                type: string
                description: "Overrides log level for this handle.\n\nDefault: <no override>\n"
              deadline_propagation_prefer_timestamp:
                type: boolean
                description: "When `true`, use X-Request-Deadline as this handler's request/task deadline when allowed\nby dynamic config. The value is still captured for propagation to downstream services when\nthe header is present.\n"
              enable_write_statistics:
                type: boolean
                description: whether to write handler statistics
              response_data_size_log_limit:
                type: integer
                description: trim responses to this size before logging
              middlewares:
                type: object
                description: middleware name -> middleware configuration map
                additionalProperties:
                  type: object
                  description: per-middleware configuration
                  additionalProperties: true
                  properties:
                    {}
                properties:
                  pipeline-builder:
                    type: string
                    description: name of a component to build a middleware pipeline for this particular handler
              deadline_expired_status_code:
                type: integer
                description: the HTTP status code to return if the request deadline expires
                minimum: 400
                maximum: 599
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              parse_args_from_body:
                type: boolean
                description: optional field to parse request according to x-www-form-urlencoded rules and make parameters accessible as query parameters
              deadline_propagation_enabled:
                type: boolean
                description: "When set to `false`, disables deadline propagation within this\nhandler. This includes:\n\n- reading the task-inherited deadline from HTTP headers and gRPC\n  metadata;\n- interrupting operations when deadline expires;\n- propagating the deadline to downstream services and databases.\n\nDeadline propagation can also be disabled in the static config of:\n- components::Server (to set the default for all HTTP handlers).\n\nDeadline propagation is disabled if disabled statically OR\ndynamically.\n"
              response-body-stream:
                type: boolean
                description: TODO
              monitor-handler:
                type: boolean
                description: overrides the in-code `is_monitor` flag that makes the handler run either on 'server.listener' or on 'server.listener-monitor'
              max_requests_per_second:
                type: integer
                description: "integer to limit RPS to this handler\n\nDefault: <no limit>\n"
      component_load_print_interval:
        type: string
        description: "How often to print still loading components list.\nUseful for debugging service start freeze.\n"
        defaultDescription: 10s
      boot-log-path:
        type: string
        description: if non-empty, defines path to boot logs
      default_task_processor:
        type: string
        description: name of the default task processor to use in components
        defaultDescription: main-task-processor
      mlock_debug_info:
        type: boolean
        description: whether to mlock(2) process debug info
        defaultDescription: true
      fs_task_processor:
        type: string
        description: name of the fs task processor to use in components
        defaultDescription: fs-task-processor
      disable_phdr_cache:
        type: boolean
        description: whether to disable caching of phdr_info objects (does not affect mlock_debug_info)
        defaultDescription: false
      enable_component_load_tracing:
        type: boolean
        description: "whether trace all components coroutines during boot, and dump\nalive coroutines stacktraces on slow boot.\nCan slow down service startup.\n"
        defaultDescription: false
      task_processors:
        type: object
        description: dictionary of task processors to create and their options
        additionalProperties:
          type: object
          description: task processor to create and its options
          additionalProperties: false
          properties:
            trace-coroutines:
              type: boolean
              description: "Whether trace all components coroutines in runtime.\nIt's required for `service/dump-coroutines` handler.\nCan significantly slow down the service.\n"
              defaultDescription: false
            task-trace:
              type: object
              description: .
              additionalProperties: false
              properties:
                logger:
                  type: string
                  description: .
                max-context-switch-count:
                  type: integer
                  description: .
                  defaultDescription: 0
                every:
                  type: integer
                  description: .
                  defaultDescription: 1000
            os-scheduling:
              type: string
              description: "OS scheduling mode for the task processor threads.\n`idle` sets the lowest priority.\n`low-priority` sets the priority below `normal` but\nhigher than `idle`.\n"
              defaultDescription: normal
              enum:
                - idle
                - low-priority
                - normal
            spinning-iterations:
              type: integer
              description: "tunes the number of spin-wait iterations in case of\nan empty task queue before threads go to sleep\n"
              defaultDescription: 1000
            guess-cpu-limit:
              type: boolean
              description: .
              defaultDescription: false
            worker_threads:
              type: integer
              description: threads count for the task processor
            task-processor-queue:
              type: string
              description: "Task queue mode for the task processor.\n`global-task-queue` default task queue.\n`work-stealing-task-queue` experimental with\npotentially better scalability than `global-task-queue`.\n"
              defaultDescription: global-task-queue
              enum:
                - pull-pin-task-queue
                - work-stealing-task-queue
                - global-task-queue
            thread_name:
              type: string
              description: set OS thread name to this value
        properties:
          {}
      preheat_stacktrace_collector:
        type: boolean
        description: whether to collect a dummy stacktrace at server start up
        defaultDescription: true
      static_config_validation:
        type: object
        description: settings for basic syntax validation in config.yaml
        additionalProperties: false
        properties:
          validate_all_components:
            type: boolean
            description: if true, all components configs are validated
      userver_experiments:
        type: object
        description: userver experiments to enable, `false` by default
        defaultDescription: "{}"
        additionalProperties:
          type: boolean
          description: whether a specific experiment is enabled
        properties:
          {}

