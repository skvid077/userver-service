type: object
description: Root object
additionalProperties: false
properties:
  components_manager:
    type: object
    description: manager-controller config
    additionalProperties: false
    properties:
      enable_trx_tracker:
        type: boolean
        description: "Enable checking of heavy operations (like http calls) while having\nactive database transactions.\n"
        defaultDescription: true
      graceful_shutdown_interval:
        type: string
        description: "Deprecated. Use graceful_shutdown_continue_accepting_requests_interval\nand graceful_shutdown_pending_requests_completion_interval instead.\n"
      graceful_shutdown_pending_requests_completion_interval:
        type: string
        description: "At shutdown, when the graceful_shutdown_continue_accepting_requests_interval has expired,\nall listeners are closed, but already accepted requests continue to be processed\nuntil this interval ends.\n"
        defaultDescription: graceful_shutdown_continue_accepting_requests_interval
      event_thread_pool:
        type: object
        description: event thread pool options
        additionalProperties: false
        properties:
          threads:
            type: integer
            description: "number of threads to process low level IO system calls (number of ev loops to start in libev)\n"
      coro_pool:
        type: object
        description: coroutines pool options
        additionalProperties: false
        properties:
          stack_usage_monitor_enabled:
            type: boolean
            description: stack usage monitor status
            defaultDescription: true
          local_cache_size:
            type: integer
            description: "Tunes local coroutine cache size per TaskProcessor worker\nthread. Current coro pool size is computed with\nan inaccuracy of local_cache_size * total_worker_threads,\nwhich may be relevant when comparing against max_size.\nLower values of local_cache_size lead to lower performance\nunder heavy contention in the engine, while higher values\nlead to inaccuracy in coro pool size estimation.\nlocal_cache_size=0 disables local cache.\n"
            defaultDescription: 8
          unoptimized_stack_size_multiplier:
            type: number
            description: "Stack size is multiplied by this number in case of unoptimized build (-O0).\nWith function inlining disabled, stack size may be increased as compared to production builds.\nUse this option to avoid annoying stack overflows during local development.\nstack_usage_monitor_enabled is advised to prevent crashes in production.\n"
            defaultDescription: 1.0
            minimum: 1
            maximum: 16
          stack_size:
            type: integer
            description: size of a single coroutine, bytes
            defaultDescription: 256 * 1024
          max_size:
            type: integer
            description: max amount of coroutines to keep preallocated
            defaultDescription: 4000
          deadlock_detector:
            type: string
            description: "Coroutines deadlock detection mode.\n    `disabled` disables deadlock detection.\n    `enabled` allows deadlock detection alongs with stacktraces collection.\n    `detect-only` allows only deadlock detection.\nDeadlock detection could slow down the service.\n"
            defaultDescription: disabled
            enum:
              - enabled
              - detect-only
              - disabled
          initial_size:
            type: integer
            description: amount of coroutines to preallocate on startup
            defaultDescription: 1000
      graceful_shutdown_continue_accepting_requests_interval:
        type: string
        description: "At shutdown, first hang for this duration with /ping 5xx to give\nthe balancer a chance to redirect new requests to other hosts and\nto give the service a chance to finish handling old requests.\n"
        defaultDescription: 0s
      components:
        type: object
        description: TODO
        additionalProperties: false
        properties:
          userver-unknown-exceptions-handling-middleware:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          userver-set-accept-encoding-middleware:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          userver-exceptions-handling-middleware:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          userver-decompression-middleware:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          userver-auth-middleware:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          tracing-manager-locator:
            type: object
            description: component for finding actual tracing manager
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              otel-trace-sampling-enabled:
                type: boolean
                description: Honor the W3C trace-context sampled flag; suppress writing of unsampled spans
              new-requests-format:
                type: array
                description: Send tracing data in those formats
                items:
                  type: string
                  description: tracing formats
                  enum:
                    - taxi
                    - yandex
                    - opentelemetry
                    - b3-alternative
              incoming-format:
                type: array
                description: Incoming tracing data formats
                items:
                  type: string
                  description: tracing formats
                  enum:
                    - taxi
                    - yandex
                    - opentelemetry
                    - b3-alternative
              component-name:
                type: string
                description: "Tracing manager component's name\n\nDefault: uses tracing::GenericTracingManager with below settings\n"
          testsuite-support:
            type: object
            description: Testsuite support component
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              cache-reverse-dependencies:
                type: array
                description: "Cache component names that must be updated synchronously before\nconcurrent cache reset starts. Used to load dynamic config into\nthe `dynamic-config` sink before config-dependent caches update.\n"
                items:
                  type: string
                  description: cache component name
              testsuite-periodic-update-enabled:
                type: boolean
                description: whether caches update periodically
              testsuite-tasks-enabled:
                type: boolean
                description: Weather or not testsuite tasks are enabled
              testsuite-periodic-dumps-enabled:
                type: boolean
                description: whether dumpable components write dumps periodically
              testsuite-grpc-is-tls-enabled:
                type: boolean
                description: whether TLS should be enabled
              testsuite-pg-execute-timeout:
                type: string
                description: execute timeout override for postgres
              testsuite-pg-statement-timeout:
                type: string
                description: statement timeout override for postgres
              testsuite-increased-timeout:
                type: string
                description: increase timeouts in testing environments. Overrides postgres, redis and grpc timeouts if these are missing
              testsuite-pg-readonly-master-expected:
                type: boolean
                description: mutes readonly master detection warning
              testsuite-redis-timeout-single:
                type: string
                description: minimum single shard timeout for redis
              testsuite-grpc-client-timeout-ms:
                type: integer
                description: forced timeout on client requests
              cache-update-execution:
                type: string
                description: "If 'sequential' the caches are updated by testsuite sequentially\nin the order for cache component registration, which makes sense\nif service has components that push value into a cache component.\nIf 'concurrent' the caches are updated concurrently with respect\nto the cache component dependencies.\n"
                enum:
                  - sequential
                  - concurrent
              testsuite-redis-timeout-connect:
                type: string
                description: minimum connection timeout for redis
              testsuite-redis-timeout-all:
                type: string
                description: minimum command timeout for redis
          userver-baggage-middleware:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          testsuite-exceptions-handling-middleware:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          userver-tracing-middleware:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          grpc-server-middlewares-pipeline:
            type: object
            description: base class for all the gRPC service components
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              middlewares:
                type: object
                description: middlewares names and configs to use
                additionalProperties:
                  type: object
                  description: a middleware config
                  additionalProperties: false
                  properties:
                    enabled:
                      type: boolean
                      description: enable middleware in the list
                properties:
                  {}
          grpc-server-logging:
            type: object
            description: gRPC service logger component
            additionalProperties: false
            properties:
              enabled:
                type: string
                description: the flag to enable/disable middleware in the pipeline
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              status-codes-log-level:
                type: object
                description: "gRPC status code string -> log level map.\nAllows overriding the log level for the response for individual statuses.\nSee grpcpp StatusCode documentation for the list of possible values:\nhttps://grpc.github.io/grpc/cpp/namespacegrpc.html#aff1730578c90160528f6a8d67ef5c43b\n\nExample:\n  -  FAILED_PRECONDITION: info"
                additionalProperties:
                  type: string
                  description: log level
                properties:
                  {}
              local-log-level:
                type: string
                description: local log level of the span for user-provided handler
                defaultDescription: not set
              msg-size-log-limit:
                type: string
                description: max message size to log, the rest will be truncated
              msg-log-level:
                type: string
                description: set up logging level for request/response messages
              log-level:
                type: string
                description: set log level threshold
          grpc-server:
            type: object
            description: Component that configures and manages the gRPC server.
            additionalProperties: false
            properties:
              service-defaults:
                type: object
                description: omitted options for service components will default to the corresponding option from here
                additionalProperties: false
                properties:
                  task-processor:
                    type: string
                    description: the task processor to use for responses
              tls:
                type: object
                description: TLS settings
                additionalProperties: false
                properties:
                  key:
                    type: string
                    description: path to TLS certificate key
                  cert:
                    type: string
                    description: path to TLS certificate
                  ca:
                    type: string
                    description: path to TLS client CA certificate
              enable-channelz:
                type: boolean
                description: enable channelz
              native-log-level:
                type: string
                description: min log level for the native gRPC library
                enum:
                  - none
                  - critical
                  - error
                  - warning
                  - info
                  - debug
                  - trace
              use-callback-api:
                type: boolean
                description: Use the gRPC callback/reactor API for server RPCs instead of completion queues.
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              completion-queue-count:
                type: integer
                description: "Number of server completion queues. With use-callback-api enabled,\nthese queues are created only when no services are registered;\nclient queues are configured through grpc-client-common.completion-queue-count.\n"
                minimum: 1
              unix-socket-path:
                type: string
                description: unix socket absolute path
              channel-args:
                type: object
                description: a map of channel arguments, see gRPC Core docs
                additionalProperties:
                  type: string
                  description: value of channel argument, must be string or integer
                properties:
                  {}
              port:
                type: integer
                description: the port to use for all gRPC services, or 0 to pick any available
          grpc-server-deadline-propagation:
            type: object
            description: gRPC server deadline propagation middleware component
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              enabled:
                type: string
                description: the flag to enable/disable middleware in the pipeline
              prefer-absolute-deadline:
                type: boolean
                description: "When enabled, the middleware prefers absolute timestamps (x-request-deadline metadata) over duration-based gRPC deadlines, analogous to deadline_propagation_prefer_timestamp in HTTP handlers.\n"
          grpc-server-congestion-control:
            type: object
            description: gRPC congestion control component
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              enabled:
                type: string
                description: the flag to enable/disable middleware in the pipeline
              grpc-status-code:
                type: string
                description: gRPC status code for ratelimited responses
          dns-client:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          mongo-db-1:
            type: object
            description: MongoDB client component
            additionalProperties: false
            properties:
              stats_verbosity:
                type: string
                description: changes the granularity of reported metrics
                enum:
                  - full
                  - none
                  - terse
              queue_timeout:
                type: string
                description: max connection queue wait time
              max_replication_lag:
                type: string
                description: replication lag limit for usable secondaries, min. 90s
              connecting_limit:
                type: integer
                description: limit for establishing connections number (per database)
              dbalias:
                type: string
                description: name of the database in secdist config (if available)
              dbconnection:
                type: string
                description: connection string (used if no dbalias specified)
              maintenance_period:
                type: string
                description: pool maintenance period (idle connections pruning etc.)
              appname:
                type: string
                description: application name for the DB server
              local_threshold:
                type: string
                description: "Latency window for instance selection.\n\nDefault: mongodb default\n"
              initial_size:
                type: string
                description: number of connections created initially (per database)
              max_size:
                type: integer
                description: limit for total connections number (per database)
              congestion_control:
                type: object
                description: congestion control settings
                additionalProperties: false
                properties:
                  enabled:
                    type: boolean
                    description: whether CC is enabled for the database
                  fake-mode:
                    type: boolean
                    description: whether CC limiter is actually working
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              so_timeout:
                type: string
                description: socket timeout
              dns_resolver:
                type: string
                description: server hostname resolver type (getaddrinfo or async)
                enum:
                  - async
                  - getaddrinfo
              conn_timeout:
                type: string
                description: connection timeout
              idle_limit:
                type: integer
                description: limit for idle connections number (per database)
          default-handler-middleware-pipeline-builder:
            type: object
            description: Base class for a component to configure server middlewares
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              append:
                type: array
                description: list of middlewares to append by default
                items:
                  type: string
                  description: name of a middleware to append
              prepend:
                type: array
                description: list of middlewares to prepend by default
                items:
                  type: string
                  description: name of a middleware to prepend
          userver-handler-adapter-middleware:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          grpc-server-graceful-shutdown-headers:
            type: object
            description: base class for grpc-server middleware
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              enabled:
                type: string
                description: the flag to enable/disable middleware in the pipeline
          userver-graceful-shutdown-headers:
            type: object
            description: Base class for all application components, it depends on components::Logger.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          default-server-middleware-pipeline-builder:
            type: object
            description: Base class for a component to configure server middlewares
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              append:
                type: array
                description: list of middlewares to append by default
                items:
                  type: string
                  description: name of a middleware to append
              prepend:
                type: array
                description: list of middlewares to prepend by default
                items:
                  type: string
                  description: name of a middleware to prepend
          dynamic-config:
            type: object
            description: Component that stores the runtime config.
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              fs-task-processor:
                type: string
                description: "Name of the task processor to run the blocking file write operations.\n\nDefault: engine::current_task::GetBlockingTaskProcessor()"
              fs-cache-path:
                type: string
                description: "Path to the file to read and dump a config cache; set to empty\nstring to disable reading and dumping configs to FS.\n\nDefault: no fs cache\n"
              defaults-path:
                type: string
                description: "Optional file with config values that override the defaults specified\nin dynamic_config::Key definitions.\n\nDefault: values from dynamic_config::Key definitions are used\n"
              defaults:
                type: object
                description: "Optional values for configs that override the defaults specified\nin dynamic_config::Key definitions\n\nDefault: values from dynamic_config::Key definitions are used\n"
                additionalProperties: true
                properties:
                  {}
              updates-enabled:
                type: boolean
                description: should be set to 'true' if there is an updater component
          manager-controller:
            type: object
            description: base component. Don't use it for application components, use ComponentBase instead
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
          server:
            type: object
            description: server schema
            additionalProperties: false
            properties:
              load-enabled:
                type: boolean
                description: set to `false` to disable loading of the component
              set-response-server-hostname:
                type: boolean
                description: set to true to add the `X-YaTaxi-Server-Hostname` header with instance name, set to false to not add the header
              listener-monitor:
                type: object
                description: describes the special monitoring socket, used for getting statistics and processing utility requests that should succeed even is the main socket is under heavy pressure
                additionalProperties: false
                properties:
                  shards:
                    type: integer
                    description: how many concurrent tasks harvest data from a single socket; do not set if not sure what it is doing
                  connection:
                    type: object
                    description: connection options
                    additionalProperties: false
                    properties:
                      http2-session:
                        type: object
                        description: settings of the HTTP/2.0 session
                        additionalProperties: false
                        properties:
                          initial_window_size:
                            type: integer
                            description: the initial window size of the server
                          max_frame_size:
                            type: integer
                            description: max size of the HTTP/2.0 frame
                          max_concurrent_streams:
                            type: integer
                            description: max number of concurrent open streams
                      stream_close_check_delay:
                        type: integer
                        description: delay in microseconds of the start of abort check routine
                      keepalive_timeout:
                        type: integer
                        description: timeout in seconds to drop connection if there's not data received from it
                      http-version:
                        type: string
                        description: HTTP protocol version
                        enum:
                          - 2
                          - 1.1
                      requests_queue_size_threshold:
                        type: integer
                        description: drop requests from handlers that allow throttling if there's more pending requests than allowed by this value
                      in_buffer_size:
                        type: integer
                        description: "size of the buffer to preallocate for request receive: bigger values use more RAM and less CPU"
                  ports:
                    type: array
                    description: settings of listener ports
                    items:
                      type: object
                      description: settings of listener port
                      additionalProperties: false
                      properties:
                        unix-socket-permissions:
                          type: string
                          description: unix socket file permissions
                        tls:
                          type: object
                          description: TLS settings
                          additionalProperties: false
                          properties:
                            private-key-passphrase-name:
                              type: string
                              description: passphrase name located in secdist
                            private-key:
                              type: string
                              description: path to TLS certificate private key
                            cert:
                              type: string
                              description: path to TLS certificate chain
                            ca:
                              type: array
                              description: paths to TLS CAs
                              items:
                                type: string
                                description: path to TLS CA
                        unix-socket:
                          type: string
                          description: unix socket to listen on instead of listening on a port
                        port:
                          type: integer
                          description: port to listen on
                        address:
                          type: string
                          description: IPv6 or IPv4 network interface to bind to
                  backlog:
                    type: integer
                    description: max count of new connections pending acceptance
                  task_processor:
                    type: string
                    description: task processor to process incoming requests
                  handler-defaults:
                    type: object
                    description: handler defaults options
                    additionalProperties: false
                    properties:
                      deadline_propagation_prefer_timestamp:
                        type: boolean
                        description: "When `true`, the handler uses a valid X-Request-Deadline (ISO 8601 UTC with\nmicrosecond fraction) as the local request deadline when dynamic config\nUSERVER_DEADLINE_PROPAGATION_ABSOLUTE_TIMESTAMP_ENABLED allows it. The header\nis still parsed for downstream forwarding whenever deadline propagation is\nenabled.\n"
                      enable_write_statistics:
                        type: boolean
                        description: whether to write handler statistics
                      deadline_expired_status_code:
                        type: integer
                        description: the HTTP status code to return if the request deadline expires
                        minimum: 400
                        maximum: 599
                      deadline_propagation_enabled:
                        type: boolean
                        description: "When `false`, disables deadline propagation by default in all HTTP handlers.\nCan be overridden by the corresponding option in server::handlers::HandlerBase.\n"
                      set_tracing_headers:
                        type: boolean
                        description: whether to set http tracing headers (X-YaTraceId, X-YaSpanId, X-RequestId)
                      parse_args_from_body:
                        type: boolean
                        description: optional field to parse request according to x-www-form-urlencoded rules and make parameters accessible as query parameters
                      response_data_size_log_limit:
                        type: integer
                        description: trim responses to this size before logging
                      request_body_size_log_limit:
                        type: integer
                        description: trim the request to this size before logging
                      max_headers_size:
                        type: integer
                        description: max headers size in bytes
                      request_headers_size_log_limit:
                        type: integer
                        description: trim request headers to this size before logging
                      max_request_size:
                        type: integer
                        description: max size of the whole data in bytes
                      max_url_size:
                        type: integer
                        description: max path/URL size in bytes
                  unix-socket-permissions:
                    type: string
                    description: unix socket file permissions
                  tls:
                    type: object
                    description: TLS settings
                    additionalProperties: false
                    properties:
                      private-key-passphrase-name:
                        type: string
                        description: passphrase name located in secdist
                      private-key:
                        type: string
                        description: path to TLS certificate private key
                      cert:
                        type: string
                        description: path to TLS certificate chain
                      ca:
                        type: array
                        description: paths to TLS CAs
                        items:
                          type: string
                          description: path to TLS CA
                  unix-socket:
                    type: string
                    description: unix socket to listen on instead of listening on a port
                  max_connections:
                    type: integer
                    description: max connections count to keep
                  listen-socket-fd:
                    type: integer
                    description: listen socket file descriptor opened, bind, and passed by the parent process
                  port:
                    type: integer
                    description: port to listen on
                  address:
                    type: string
                    description: IPv6 or IPv4 network interface to bind to
              listener:
                type: object
                description: describes the request processing socket
                additionalProperties: false
                properties:
                  shards:
                    type: integer
                    description: how many concurrent tasks harvest data from a single socket; do not set if not sure what it is doing
                  connection:
                    type: object
                    description: connection options
                    additionalProperties: false
                    properties:
                      http2-session:
                        type: object
                        description: settings of the HTTP/2.0 session
                        additionalProperties: false
                        properties:
                          initial_window_size:
                            type: integer
                            description: the initial window size of the server
                          max_frame_size:
                            type: integer
                            description: max size of the HTTP/2.0 frame
                          max_concurrent_streams:
                            type: integer
                            description: max number of concurrent open streams
                      stream_close_check_delay:
                        type: integer
                        description: delay in microseconds of the start of abort check routine
                      keepalive_timeout:
                        type: integer
                        description: timeout in seconds to drop connection if there's not data received from it
                      http-version:
                        type: string
                        description: HTTP protocol version
                        enum:
                          - 2
                          - 1.1
                      requests_queue_size_threshold:
                        type: integer
                        description: drop requests from handlers that allow throttling if there's more pending requests than allowed by this value
                      in_buffer_size:
                        type: integer
                        description: "size of the buffer to preallocate for request receive: bigger values use more RAM and less CPU"
                  ports:
                    type: array
                    description: settings of listener ports
                    items:
                      type: object
                      description: settings of listener port
                      additionalProperties: false
                      properties:
                        unix-socket-permissions:
                          type: string
                          description: unix socket file permissions
                        tls:
                          type: object
                          description: TLS settings
                          additionalProperties: false
                          properties:
                            private-key-passphrase-name:
                              type: string
                              description: passphrase name located in secdist
                            private-key:
                              type: string
                              description: path to TLS certificate private key
                            cert:
                              type: string
                              description: path to TLS certificate chain
                            ca:
                              type: array
                              description: paths to TLS CAs
                              items:
                                type: string
                                description: path to TLS CA
                        unix-socket:
                          type: string
                          description: unix socket to listen on instead of listening on a port
                        port:
                          type: integer
                          description: port to listen on
                        address:
                          type: string
                          description: IPv6 or IPv4 network interface to bind to
